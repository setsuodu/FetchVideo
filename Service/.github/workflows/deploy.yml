name: Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 如果推送到 GitHub Packages Registry 则需要此权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: setsuodu/fetch-service # 您的 Docker Hub 镜像名称
          tags: |
            type=sha,format=short,prefix= # 使用短 SHA 作为标签 (例如: setsuodu/fetch-service:abcdef1)
            type=raw,value=latest         # 推送 latest 标签 (例如: setsuodu/fetch-service:latest)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Service/Service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}